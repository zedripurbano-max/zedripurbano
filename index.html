<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZEDRIP - Ropa Urbana</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial, Helvetica, sans-serif}
body{background:#f5f1ea;color:#111}
header{background:#111;color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100;min-height:60px}
header b{font-size:clamp(18px,3vw,26px);letter-spacing:3px;white-space:nowrap}
header button{background:#fff;color:#111;border:none;padding:9px 14px;border-radius:25px;font-weight:800;cursor:pointer;font-size:13px;white-space:nowrap}
/* HERO - FOTO COMPLETA CON LOS MODELOS */
.hero{position:relative;width:100%;background:#e9ddd0;display:flex;align-items:flex-end;overflow:hidden}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#e9ddd0}
.hero-overlay{position:absolute;inset:0;background:linear-gradient(to top, rgba(0,0,0,.68) 0%, rgba(0,0,0,.18) 42%, rgba(0,0,0,0) 68%);pointer-events:none}
.hero-text{position:relative;z-index:2;padding:24px 20px 28px;width:100%;color:#fff}
.hero-text h1{font-size:clamp(48px,9vw,110px);letter-spacing:5px;line-height:.9;font-weight:900}
.hero-text p{margin:12px 0 18px;font-size:clamp(14px,2vw,20px);line-height:1.45;max-width:520px}
.hero-text a{display:inline-block;background:#fff;color:#111;text-decoration:none;padding:13px 24px;border-radius:30px;font-weight:800;font-size:14px}
/* RESPONSIVE - SE ADAPTA A TODO */
@media(max-width:600px){.hero{height:72vh;min-height:480px}.hero-text{padding:20px 16px 22px}}
@media(min-width:601px) and (max-width:900px){.hero{height:78vh;min-height:520px}.hero-text{padding:28px 28px 32px}}
@media(min-width:901px) and (max-width:1200px){.hero{height:84vh;min-height:560px}.hero-text{padding:36px 40px 40px}}
@media(min-width:1201px){.hero{height:88vh;min-height:620px}.hero-text{padding:44px 60px 48px;max-width:1200px;margin:0 auto}}
.filters{display:flex;gap:8px;overflow-x:auto;padding:16px 12px;white-space:nowrap;max-width:1200px;margin:0 auto}
.filters button{border:1px solid #ddd;background:#fff;padding:11px 20px;border-radius:25px;cursor:pointer;font-size:15px}
.filters .active{background:#111;color:#fff}
.search{padding:0 12px 14px;max-width:1200px;margin:0 auto}
.search input{width:100%;padding:14px 16px;border-radius:25px;border:1px solid #ddd;font-size:15px;background:#fff}
h2{padding:6px 16px 16px;font-size:clamp(22px,3vw,32px);max-width:1200px;margin:0 auto}
.grid{display:grid;gap:14px;padding:0 12px 20px;max-width:1200px;margin:0 auto;grid-template-columns:1fr 1fr}
