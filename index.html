<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZEDRIP - Tienda</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#f5f0e8}
header{background:#000;color:#fff;padding:15px;display:flex;justify-content:space-between;align-items:center}
header b{font-size:22px;letter-spacing:2px}
.cart{background:#fff;color:#000;padding:8px 14px;border-radius:20px;font-size:13px;font-weight:bold}
.hero{background:#000;color:#fff;padding:30px 20px;background-image:url('https://images.unsplash.com/photo-1529139574466-a303027c1d8b?w=800');background-size:cover;background-position:center}
.hero h1{font-size:45px;margin:10px 0}
.hero p{font-size:14px;opacity:.9}
.btn{display:inline-block;background:#fff;color:#000;padding:12px 20px;border-radius:25px;font-weight:bold;margin-top:15px;text-decoration:none;font-size:14px}
.filters{display:flex;gap:8px;padding:15px;overflow-x:auto}
.filters button{padding:10px 18px;border-radius:20px;border:1px solid #ddd;background:#fff;white-space:nowrap}
.filters button.active{background:#000;color:#fff}
.search{padding:0 15px}
.search input{width:100%;padding:13px;border-radius:25px;border:1px solid #ddd;font-size:15px}
h2{padding:20px 15px 5px;font-size:22px}
#productos{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:15px}
.card{background:#fff;border-radius:15px;overflow:hidden;padding-bottom:12px}
.card img{width:100%;height:180px;object-fit:cover}
.card .info{padding:10px}
.card b{font-size:14px}
.card p{color:#666;font-size:13px;margin:4px 0}
.card .precio{font-weight:bold;font-size:16px}
.card button{width:90%;margin:8px 5%;background:#000;color:#fff;border:0;padding:10px;border-radius:20px;font-weight:bold}
.edit-btn{display:block;text-align:center;background:#000;color:#fff;margin:10px 20px;padding:13px;border-radius:25px;text-decoration:none;font-weight:bold}
.empty{grid-column:1/3;text-align:center;padding:30px;color:#888}
</style>
</head>
<body>
<header><b>ZEDRIP</b><div class="cart">🛒 Carrito: S/ <span id="total">0.00</span></div></header>
<div class="hero"><h1>ZEDRIP</h1><p>Viste diferente, vive con actitud. Ropa urbana hecha para los que no siguen la moda, la crean.</p><a class="btn" href="#productos">VER PRODUCTOS →</a></div>
<div class="filters"><button class="active" onclick="filtrar('Todos',this)">Todos</button><button onclick="filtrar('Polos',this)">Polos</button><button onclick="filtrar('Hoodies',this)">Hoodies</button><button onclick="filtrar('Pantalones',this)">Pantalones</button></div>
<div class="search"><input id="buscador" placeholder="🔍 Buscar en ZEDRIP..." oninput="mostrar()"></div>
<h2>NUESTROS PRODUCTOS</h2>
<div id="productos"></div>
<a class="edit-btn" href="admin.html">⚙️ EDITAR MI TIENDA</a>
<script>
let filtro='Todos';
let carrito=0;
function getProductos(){
  let guardados=JSON.parse(localStorage.getItem('zedrip_productos')||'[]');
  if(guardados.length>0) return guardados;
  return [
    {nombre:'Polo Oversize Blanco',precio:59,categoria:'Polos',foto:'https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=500'},
    {nombre:'Hoodie Negro ZEDRIP',precio:129,categoria:'Hoodies',foto:'https://images.unsplash.com/photo-1556821840-3a63f95609a7?w=500'},
    {nombre:'Pantalón Cargo Beige',precio:99,categoria:'Pantalones',foto:'https://images.unsplash.com/photo-1473966968600-fa801b869a1a?w=500'}
  ];
}
function filtrar(cat,btn){
  filtro=cat;
  document.querySelectorAll('.filters button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  mostrar();
}
function mostrar(){
  let lista=getProductos();
  let bus=document.getElementById('buscador').value.toLowerCase();
  let div=document.getElementById('productos');
  div.innerHTML='';
  let filtrados=lista.filter(p=>(filtro==='Todos'||p.categoria===filtro)&&p.nombre.toLowerCase().includes(bus));
  if(filtrados.length===0){div.innerHTML='<div class="empty">Aún no hay productos.<br>Entra a EDITAR MI TIENDA y agrega uno.</div>';return;}
  filtrados.forEach(p=>{
    div.innerHTML+=`<div class="card"><img src="${p.foto}"><div class="info"><b>${p.nombre}</b><p>${p.categoria}</p><div class="precio">S/ ${p.precio}</div></div><button onclick="agregar(${p.precio})">AGREGAR 🛒</button></div>`;
  });
}
function agregar(precio){carrito+=Number(precio);document.getElementById('total').innerText=carrito.toFixed(2);alert('Agregado al carrito ✅');}
mostrar();
</script>
</body>
</html>
