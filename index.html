<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ZEDRIP</title><style>body{font-family:Arial;background:#f5f0e6;margin:0;padding:0}.header{background:#000;color:#fff;padding:20px;text-align:center}h1{margin:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px;padding:15px}.card{background:#fff;border-radius:12px;overflow:hidden;text-align:center;padding-bottom:10px}.card img{width:100%;height:200px;object-fit:cover}.btn{background:#000;color:#fff;border:none;padding:10px 20px;border-radius:20px;margin-top:10px}.edit{display:block;text-align:center;background:#000;color:#fff;padding:15px;margin:20px;border-radius:30px;text-decoration:none}</style></head>
<body><div class="header"><h1>ZEDRIP</h1><p>Viste diferente, vive con actitud.</p></div><div class="grid" id="lista"></div><a class="edit" href="admin.html">⚙️ EDITAR MI TIENDA</a>
<script>
let base=[
{nombre:"Polo Oversize Blanco",precio:59,categoria:"Polos",foto:"https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=500"},
{nombre:"Hoodie Negro ZEDRIP",precio:129,categoria:"Hoodies",foto:"https://images.unsplash.com/photo-1556821840-3a63f95609a7?w=500"},
{nombre:"Pantalón Cargo Beige",precio:99,categoria:"Pantalones",foto:"https://images.unsplash.com/photo-1624378439575-d8705ad7ae80?w=500"}
];
let guardados=JSON.parse(localStorage.getItem("productos_zedrip")||"null");
let productos=guardados||base;
let html="";
productos.forEach(p=>{
html+=`<div class="card"><img src="${p.foto}"><h3>${p.nombre}</h3><p>S/ ${p.precio}</p><button class="btn">AGREGAR 🛒</button></div>`
});
document.getElementById("lista").innerHTML=html||"<p>Aún no hay productos</p>";
</script></body></html>
