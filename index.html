<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZEDRIP - Ropa Urbana</title>
<style>
*{box-sizing:border-box;font-family:Arial} body{margin:0;background:#f2f2f2}
header{background:#000;color:#fff;padding:15px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0}
header b{font-size:20px;letter-spacing:2px}
header a{color:#fff;text-decoration:none;font-size:13px;border:1px solid #fff;padding:6px 12px;border-radius:20px}
.hero{background:#000;color:#fff;text-align:center;padding:30px 15px}
.hero h1{margin:0;font-size:32px;letter-spacing:3px}
.hero p{color:#aaa}
#tienda{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px}
.card{background:#fff;border-radius:14px;overflow:hidden;text-align:center;padding-bottom:12px}
.card img{width:100%;height:180px;object-fit:cover}
.card h3{margin:8px 5px 2px;font-size:15px}
.card p{margin:2px;color:#777;font-size:12px}
.precio{font-weight:bold;font-size:18px;margin:5px}
.card button{background:#25D366;border:0;padding:9px 15px;border-radius:20px;font-weight:bold}
footer{text-align:center;padding:20px;color:#888;font-size:13px}
</style>
</head>
<body>
<header><b>ZEDRIP</b><a href="admin.html">Admin</a></header>
<div class="hero"><h1>ZEDRIP</h1><p>Ropa urbana - Estilo que se nota 🔥</p><p>Pedidos por WhatsApp - Envíos a todo Perú</p></div>
<div id="tienda"><p style="padding:20px">Cargando productos...</p></div>
<footer>ZEDRIP © 2026 - WhatsApp +51 982 586 652</footer>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "PEGA_AQUI_APIKEY",
  authDomain: "PEGA_AQUI_AUTHDOMAIN",
  projectId: "PEGA_AQUI_PROJECTID",
  storageBucket: "PEGA_AQUI_STORAGE",
  messagingSenderId: "PEGA_AQUI_SENDER",
  appId: "PEGA_AQUI_APPID"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
async function cargar(){
  const snap = await getDocs(collection(db,"productos"));
  let html="";
  snap.forEach(d=>{
    const p=d.data();
    html+=`<div class="card"><img src="${p.foto}"><h3>${p.nombre}</h3><p>${p.desc||''}</p><div class="precio">S/ ${p.precio}</div><button onclick="pedir('${p.nombre}')">Pedir por WhatsApp</button></div>`;
  });
  document.getElementById('tienda').innerHTML = html || "<p style='padding:20px'>Aún no hay productos. Pronto nuevos drops.</p>";
}
cargar();
window.pedir=(n)=>{ window.open("https://wa.me/51982586652?text=Hola ZEDRIP, quiero "+encodeURIComponent(n)," _blank"); };
</script>
</body>
</html>
