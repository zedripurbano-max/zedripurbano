<!-- ZEDRIP V2 - NUEVO - NO TRADUCIR -->
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZEDRIP - Ropa Urbana</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial, Helvetica, sans-serif}
body{background:#f5f1ea;color:#111}
header{background:#111;color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100}
header b{font-size:clamp(18px,3vw,26px);letter-spacing:3px}
header button{background:#fff;color:#111;border:none;padding:9px 14px;border-radius:25px;font-weight:800;font-size:13px}
.hero{position:relative;width:100%;background:#e9ddd0;display:flex;align-items:flex-end;overflow:hidden}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#e9ddd0}
.hero-overlay{position:absolute;inset:0;background:linear-gradient(to top, rgba(0,0,0,.68), rgba(0,0,0,.15) 42%, transparent 68%)}
.hero-text{position:relative;z-index:2;padding:24px 20px 28px;width:100%;color:#fff}
.hero-text h1{font-size:clamp(48px,9vw,110px);letter-spacing:5px;line-height:.9;font-weight:900}
.hero-text p{margin:12px 0 18px;font-size:clamp(14px,2vw,20px);max-width:520px;line-height:1.45}
.hero-text a{display:inline-block;background:#fff;color:#111;text-decoration:none;padding:13px 24px;border-radius:30px;font-weight:800}
@media(max-width:600px){.hero{height:72vh;min-height:480px}}
@media(min-width:601px) and (max-width:900px){.hero{height:78vh;min-height:520px}}
@media(min-width:901px) and (max-width:1200px){.hero{height:84vh;min-height:560px}}
@media(min-width:1201px){.hero{height:88vh;min-height:620px}.hero-text{padding:44px 60px 48px;max-width:1200px;margin:0 auto}}
.filters{display:flex;gap:8px;overflow-x:auto;padding:16px 12px;max-width:1200px;margin:0 auto}
.filters button{border:1px solid #ddd;background:#fff;padding:11px 20px;border-radius:25px}
.filters .active{background:#111;color:#fff}
.search{padding:0 12px 14px;max-width:1200px;margin:0 auto}
.search input{width:100%;padding:14px;border-radius:25px;border:1px solid #ddd}
h2{padding:6px 16px 16px;max-width:1200px;margin:0 auto}
.grid{display:grid;gap:14px;padding:0 12px 20px;max-width:1200px;margin:0 auto;grid-template-columns:1fr 1fr}
@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:1100px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{background:#fff;border-radius:18px;overflow:hidden;position:relative}
.card.agotado{opacity:.6}
.card img{width:100%;height:250px;object-fit:cover}
.badge{position:absolute;top:10px;left:10px;background:#e11d48;color:#fff;padding:5px 10px;border-radius:20px;font-size:12px;font-weight:800}
.card-info{padding:12px}.price{font-weight:800;margin-top:5px}
.card button{width:100%;margin-top:9px;background:#111;color:#fff;border:none;padding:11px;border-radius:11px;font-weight:700}
.admin-link{text-align:center;padding:0 0 35px}
.admin-link button{background:#111;color:#fff;border:none;padding:14px 24px;border-radius:30px;font-weight:800;font-size:15px}
#panel{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:200;overflow:auto}
.panel-box{background:#fff;margin:15px auto;padding:20px;border-radius:20px;max-width:600px;width:92%}
.panel-box input,.panel-box select{width:100%;padding:13px;border:1px solid #ddd;border-radius:12px;margin:7px 0;font-size:16px}
.panel-box label{font-weight:800;font-size:14px;margin-top:12px;display:block}
.btn-black{background:#111;color:#fff;border:none;padding:15px;border-radius:12px;width:100%;font-weight:800;font-size:16px;margin-top:10px}
.btn-foto{background:#f5f1ea;border:2px dashed #111;padding:15px;border-radius:12px;width:100%;font-weight:800;font-size:16px}
.btn-gray{background:#eee;border:none;padding:11px;border-radius:10px;margin-top:6px;width:100%;font-size:15px}
.item-admin{border:1px solid #eee;border-radius:14px;padding:12px;margin:12px 0;display:flex;gap:12px;align-items:center}
.item-admin img{width:65px;height:65px;object-fit:cover;border-radius:10px}
.preview{width:100%;height:180px;object-fit:cover;border-radius:12px;display:none;margin-top:8px}
</style>
</head>
<body>
<header><b>ZEDRIP</b><button>🛒 Carrito: S/ <span id="total">0.00</span></button></header>
<section class="hero"><img src="hero.jpg"><div class="hero-overlay"></div><div class="hero-text"><h1>ZEDRIP</h1><p>Viste diferente, vive con actitud. Ropa urbana hecha para los que no siguen la moda, la crean.</p><a href="#productos">VER PRODUCTOS →</a></div></section>
<div class="filters"><button class="active" onclick="filtrar('all',this)">Todos</button><button onclick="filtrar('polos',this)">Polos</button><button onclick="filtrar('hoodies',this)">Hoodies</button><button onclick="filtrar('pantalones',this)">Pantalones</button></div>
<div class="search"><input id="buscador" placeholder="🔍 Buscar en ZEDRIP..." oninput="buscar()"></div>
<h2 id="productos">NUESTROS PRODUCTOS</h2>
<div class="grid" id="grid"></div>
<div class="admin-link"><button onclick="abrirAdmin()">⚙️ EDITAR MI TIENDA</button></div>
<div id="panel"><div class="panel-box">
<h2>🔐 Mi Tienda</h2>
<div id="loginBox"><label>Tu clave</label><input id="pass" type="password" placeholder="zedrip123"><button class="btn-black" onclick="login()">ENTRAR ✅</button><button class="btn-gray" onclick="cerrarAdmin()">Cerrar ✖️</button></div>
<div id="adminBox" style="display:none">
<h3>➕ Nuevo producto</h3>
<label>1. Nombre</label><input id="f-nombre" placeholder="Ej: Polo Negro Oversize">
<label>2. Precio S/</label><input id="f-precio" type="number" placeholder="Ej: 59">
<label>3. Categoria</label><select id="f-cat"><option value="polos">Polos</option><option value="hoodies">Hoodies</option><option value="pantalones">Pantalones</option></select>
<label>4. Foto</label><button class="btn-foto" onclick="document.getElementById('f-file').click()">📷 ELEGIR FOTO DE MI GALERIA</button><input type="file" id="f-file" accept="image/*" style="display:none" onchange="verFoto(this)"><img id="preview" class="preview">
<label>5. Disponible?</label><select id="f-disp"><option value="1">✅ Si, si lo tengo</option><option value="0">❌ No, esta agotado</option></select>
<button class="btn-black" onclick="guardarNuevo()">💾 GUARDAR PRODUCTO</button>
<h3 style="margin-top:22px">📦 Mis productos</h3><div id="listaAdmin"></div><button class="btn-gray" onclick="cerrarAdmin()">Salir</button></div>
</div></div>
<script>
let total=0, fotoTemp="";
let defecto=[
 {n:"Polo Oversize Blanco",c:"polos",p:59,img:"https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=800",disp:1},
 {n:"Polo Graphic Beige",c:"polos",p:69,img:"https://images.unsplash.com/photo-1576566588028-4147f3842f27?w=800",disp:1},
 {n:"Hoodie Negro ZEDRIP",c:"hoodies",p:129,img:"https://images.unsplash.com/photo-1556821840-3a63f95609a7?w=800",disp:1},
 {n:"Pantalon Cargo Negro",c:"pantalones",p:119,img:"https://images.unsplash.com/photo-1594633312681-425c7b97ccd1?w=800",disp:1},
];
let productos = JSON.parse(localStorage.getItem('zedrip_productos')||'null') || defecto;
function save(){localStorage.setItem('zedrip_productos', JSON.stringify(productos));}
function pintar(lista){document.getElementById('grid').innerHTML=lista.map(pr=>`<div class="card ${pr.disp==0?'agotado':''}">${pr.disp==0?'<div class="badge">AGOTADO</div>':''}<img src="${pr.img}"><div class="card-info"><b>${pr.n}</b><p>${pr.c}</p><div class="price">S/ ${pr.p}.00</div><button ${pr.disp==0?'disabled':''} onclick="agregar(${pr.p})">${pr.disp==0?'Agotado':'Agregar +'}</button></div></div>`).join('');}
function agregar(p){total+=p;document.getElementById('total').innerText=total.toFixed(2);}
function filtrar(cat,btn){document.querySelectorAll('.filters button').forEach(b=>b.classList.remove('active'));btn.classList.add('active');pintar(cat==='all'?productos:productos.filter(x=>x.c===cat));}
function buscar(){let q=document.getElementById('buscador').value.toLowerCase();pintar(productos.filter(x=>x.n.toLowerCase().includes(q)));}
function abrirAdmin(){document.getElementById('panel').style.display='block';}
function cerrarAdmin(){document.getElementById('panel').style.display='none';}
function login(){if(document.getElementById('pass').value==='zedrip123'){document.getElementById('loginBox').style.display='none';document.getElementById('adminBox').style.display='block';renderAdmin();}else alert('Clave incorrecta');}
function verFoto(input){let r=new FileReader();r.onload=function(e){fotoTemp=e.target.result;let p=document.getElementById('preview');p.src=fotoTemp;p.style.display='block';};r.readAsDataURL(input.files[0]);}
function guardarNuevo(){let n=document.getElementById('f-nombre').value, p=document.getElementById('f-precio').value;if(!n||!p||!fotoTemp){alert('Falta nombre, precio o foto');return;}productos.push({n:n,c:document.getElementById('f-cat').value,p:Number(p),img:fotoTemp,disp:Number(document.getElementById('f-disp').value)});save();pintar(productos);renderAdmin();alert('Guardado ✅');document.getElementById('f-nombre').value='';document.getElementById('f-precio').value='';fotoTemp='';document.getElementById('preview').style.display='none';}
function renderAdmin(){document.getElementById('listaAdmin').innerHTML=productos.map((pr,i)=>`<div class="item-admin"><img src="${pr.img}"><div style="flex:1"><b>${pr.n}</b><br><small>S/ ${pr
