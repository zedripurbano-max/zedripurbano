<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Admin ZEDRIP</title><style>body{font-family:Arial;padding:15px;background:#f5f5f5}input,select{width:100%;padding:10px;margin:6px 0;border:1px solid #ccc;border-radius:10px;box-sizing:border-box}button{padding:12px;border:none;border-radius:10px;font-weight:bold}.card{background:#fff;padding:12px;border-radius:12px;margin:10px 0}.card img{width:100%;height:150px;object-fit:cover;border-radius:10px}.heroMini{width:100%;height:140px;background:#000 url('hero.jpg') center/cover no-repeat;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#fff;font-family:Georgia;font-size:32px;letter-spacing:4px}.grupo{border:1px solid #ddd;border-radius:12px;padding:10px;margin:8px 0;background:#fff}.grupo b{font-size:14px}.mini{width:100%;height:110px;object-fit:cover;border-radius:10px;display:none;margin-top:6px}</style></head><body>
<div class="heroMini">ZEDRIP</div>
<h2 style="margin:12px 0 0">ADMIN ZEDRIP</h2><a href="index.html">← Ver tienda</a> | <a href="#" onclick="sessionStorage.removeItem('zedrip_admin');location.href='index.html'">🔒 Cerrar sesión</a><hr>
<h3>Agregar producto</h3><input id="n" placeholder="Nombre ej: Polo Drip Oversize"><input id="p" type="number" placeholder="Precio ej: 25"><select id="c"><option>Polos</option><option>Hoodies</option><option>Joggers</option><option>Polo drip</option></select>
<p style="font-size:13px;margin:10px 0 5px"><b>📸 SUBE DESDE TU GALERÍA - SIN LINKS:</b></p>
<div class="grupo"><b>⚫ NEGRO - Modelo puesto</b><input type="file" id="fModeloNegro" accept="image/*"><img id="vModeloNegro" class="mini"><b>⚫ NEGRO - Prenda sola</b><input type="file" id="fPrendaNegro" accept="image/*"><img id="vPrendaNegro" class="mini"></div>
<div class="grupo"><b>⚪ BLANCO - Modelo puesto</b><input type="file" id="fModeloBlanco" accept="image/*"><img id="vModeloBlanco" class="mini"><b>⚪ BLANCO - Prenda sola</b><input type="file" id="fPrendaBlanco" accept="image/*"><img id="vPrendaBlanco" class="mini"></div>
<div class="grupo"><b>⬜ GRIS - Modelo puesto</b><input type="file" id="fModeloGris" accept="image/*"><img id="vModeloGris" class="mini"><b>⬜ GRIS - Prenda sola</b><input type="file" id="fPrendaGris" accept="image/*"><img id="vPrendaGris" class="mini"></div>
<button style="background:#000;color:#fff;width:100%" onclick="agregar()">+ AGREGAR PRODUCTO</button>
<h3>Productos</h3><div id="lista"></div><h3>Pedidos</h3><div id="ped"></div><h3>Reservas</h3><div id="res"></div>
<script>
if(sessionStorage.getItem('zedrip_admin')!=='ok'){let c=prompt('🔒 Contraseña Admin ZEDRIP:');if(c!=='zedripmiguel0505200822'){alert('Contraseña incorrecta');window.location.href='index.html';}else{sessionStorage.setItem('zedrip_admin','ok');}}
let fotos={modeloNegro:'',prendaNegro:'',modeloBlanco:'',prendaBlanco:'',modeloGris:'',prendaGris:''};
function ligar(inputId,vistaId,clave){document.getElementById(inputId).onchange=function(e){let f=e.target.files[0];if(!f) return;let r=new FileReader();r.onload=function(){fotos[clave]=r.result;let v=document.getElementById(vistaId);v.src=fotos[clave];v.style.display='block';};r.readAsDataURL(f);}; }
ligar('fModeloNegro','vModeloNegro','modeloNegro');ligar('fPrendaNegro','vPrendaNegro','prendaNegro');ligar('fModeloBlanco','vModeloBlanco','modeloBlanco');ligar('fPrendaBlanco','vPrendaBlanco','prendaBlanco');ligar('fModeloGris','vModeloGris','modeloGris');ligar('fPrendaGris','vPrendaGris','prendaGris');
function getP(){let d=localStorage.getItem('zedrip_prods');if(d){let p=JSON.parse(d);if(p.length>0) return p;}return [{n:'Polo Drip Oversize',c:'Polos',p:49.99,img:'',modeloNegro:'',prendaNegro:'',modeloBlanco:'',prendaBlanco:'',modeloGris:'',prendaGris:''}];}
function pintar(){let l=document.getElementById('lista');l.innerHTML='';getP().forEach((x,i)=>{let f=x.prendaNegro||x.modeloNegro||x.prendaBlanco||x.modeloBlanco||x.prendaGris||x.modeloGris||x.img||'';if(x.n.toLowerCase().includes('blanco')) f=x.prendaBlanco||x.modeloBlanco||f;if(x.n.toLowerCase().includes('gris')) f=x.prendaGris||x.modeloGris||f;l.innerHTML+=`<div class="card"><img src="${f}"><b>${x.n}</b> - S/ ${x.p}<br>${x.c}<br><button onclick="borrar(${i})" style="background:red;color:#fff;margin-top:8px">Borrar</button></div>`});let pe=JSON.parse(localStorage.getItem('zedrip_pedidos')||'[]');document.getElementById('ped').innerHTML=pe.length?pe.map(x=>`<div class="card">${x.fecha} - ${x.nombre} - ${x.tel} - ${x.entrega} - ${x.pago} - S/ ${x.total} - ${x.items.map(i=>i.n+' '+i.color+' '+i.talla).join(', ')}</div>`).join(''):'Sin pedidos';let r=JSON.parse(localStorage.getItem('zedrip_reservas')||'[]');document.getElementById('res').innerHTML=r.length?r.map(x=>`<div class="card">${x.fecha} - ${x.prod} - ${x.nombre} - ${x.tel} - Modelo: ${x.modelo||x.color} - Talla: ${x.talla} - Cant: ${x.cant}</div>`).join(''):'Sin reservas';}
function agregar(){let n=document.getElementById('n').value,p=parseFloat(document.getElementById('p').value);if(!n||!p){alert('Pon nombre y precio');return;}if(!fotos.modeloNegro && !fotos.prendaNegro && !fotos.modeloBlanco && !fotos.prendaBlanco && !fotos.modeloGris && !fotos.prendaGris){alert('Sube al menos 1 foto desde tu galería');return;}let arr=getP();let principal=fotos.prendaNegro||fotos.modeloNegro||fotos.prendaBlanco||fotos.modeloBlanco||fotos.prendaGris||fotos.modeloGris||'';arr.push({n:n,c:document.getElementById('c').value,p:p,img:principal,negro:principal,blanco:principal,gris:principal,modeloNegro:fotos.modeloNegro,prendaNegro:fotos.prendaNegro,modeloBlanco:fotos.modeloBlanco,prendaBlanco:fotos.prendaBlanco,modeloGris:fotos.modeloGris,prendaGris:fotos.prendaGris});localStorage.setItem('zedrip_prods',JSON.stringify(arr));fotos={modeloNegro:'',prendaNegro:'',modeloBlanco:'',prendaBlanco:'',modeloGris:'',prendaGris:''};document.querySelectorAll('.mini').forEach(v=>{v.style.display='none';v.src='';});document.querySelectorAll('input[type=file]').forEach(i=>i.value='');pintar();alert('Agregado');}
function borrar(i){let a=getP();a.splice(i,1);localStorage.setItem('zedrip_prods',JSON.stringify(a));pintar();}
pintar();
</script></body></html>
