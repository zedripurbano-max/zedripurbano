<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Editar Mi Tienda - ZEDRIP</title>
<style>
body{font-family:Arial;background:#f2f2f2;padding:15px;margin:0}
h1{text-align:center}
.caja{background:white;padding:15px;border-radius:15px;margin-bottom:15px}
input,select{width:100%;padding:12px;margin:8px 0;border:1px solid #ccc;border-radius:10px;font-size:16px;box-sizing:border-box}
button{width:100%;padding:13px;border:none;border-radius:10px;font-size:16px;font-weight:bold;cursor:pointer}
.guardar{background:#00c853;color:white}
.ver{background:#111;color:white;margin-top:10px}
.prod{background:white;padding:12px;border-radius:12px;margin-bottom:12px}
.prod img{width:100%;height:220px;object-fit:cover;border-radius:10px}
.reservar{background:#25D366;color:white;margin-top:8px}
.borrar{background:red;color:white;padding:8px;border-radius:8px;width:auto;margin-top:8px}
img#vista{width:100%;max-height:220px;object-fit:cover;border-radius:12px;display:none;margin-top:10px}
</style>
</head>
<body>
<script>
if(prompt("Contraseña de ZEDRIP:")!=="zedrip123"){document.body.innerHTML="<h1>⛔ No tienes acceso</h1>";throw new Error("bloqueado");}
</script>
<h1>⚙️ EDITAR MI TIENDA</h1>
<p style="text-align:center">Como en Marea, bro. Llenas, guardas y listo.</p>
<div class="caja">
<b>Tu WhatsApp para reservas (1 sola vez):</b>
<input id="miWsp" placeholder="Ej: 51987654321">
<b>Nombre del polo:</b>
<input id="nombre" placeholder="Ej: Polo Oversize Negro">
<b>Precio S/:</b>
<input id="precio" type="number" placeholder="Ej: 59.90">
<b>Foto del polo:</b>
<input id="foto" type="file" accept="image/*">
<img id="vista">
<b>¿Está disponible?</b>
<select id="disp"><option value="SI">✅ SÍ, disponible</option><option value="NO">❌ NO, agotado</option></select>
<b>¿Permitir reservar?</b>
<select id="res"><option value="SI">✅ SÍ, botón de RESERVAR</option><option value="NO">❌ NO, sin reservar</option></select>
<button class="guardar" onclick="guardar()">✅ GUARDAR Y PUBLICAR</button>
</div>
<h2>Mis productos:</h2>
<div id="lista"></div>
<button class="ver" onclick="location.href='index.html'">👀 VER MI TIENDA</button>
<script>
let fotoBase="";
document.getElementById('foto').addEventListener('change',function(e){
let r=new FileReader();r.onload=function(ev){fotoBase=ev.target.result;document.getElementById('vista').src=fotoBase;document.getElementById('vista').style.display='block';};r.readAsDataURL(e.target.files[0]);});
document.getElementById('miWsp').value=localStorage.getItem('zedrip_wsp')||'';
function cargar(){
let prods=JSON.parse(localStorage.getItem('zedrip_productos')||'[]');
let html="";
prods.forEach((p,i)=>{
let btnRes="";
if(p.res=='SI'){if(p.disp=='SI'){btnRes=`<button class="reservar" onclick="reservar('${p.nombre}','${p.precio}')">📩 RESERVAR POR WHATSAPP</button>`;}else{btnRes=`<button style="background:#999;color:white;margin-top:8px" disabled>❌ AGOTADO</button>`;}}
html+=`<div class="prod"><img src="${p.foto}"><b>${p.nombre}</b><br>S/ ${p.precio} - ${p.disp=='SI'?'✅ Disponible':'❌ Agotado'}<br>${btnRes}<button class="borrar" onclick="borrar(${i})">Eliminar producto</button></div>`;});
document.getElementById('lista').innerHTML=html||"Aún no hay productos. Agrega el primero arriba.";}
function reservar(n,pr){
let wsp=localStorage.getItem('zedrip_wsp')||'51999999999';
let msg=encodeURIComponent("Hola ZEDRIP! Quiero RESERVAR el polo: "+n+" - S/ "+pr+" ¿Sigue disponible?");
window.open("https://wa.me/"+wsp+"?text="+msg,"_blank");}
function guardar(){
let n=document.getElementById('nombre').value;let pr=document.getElementById('precio').value;let d=document.getElementById('disp').value;let r=document.getElementById('res').value;let wsp=document.getElementById('miWsp').value;
if(wsp)localStorage.setItem('zedrip_wsp',wsp);
if(!n||!pr||!fotoBase){alert('Falta nombre, precio o foto bro');return;}
let prods=JSON.parse(localStorage.getItem('zedrip_productos')||'[]');
prods.push({nombre:n,precio:pr,foto:fotoBase,disp:d,res:r});
localStorage.setItem('zedrip_productos',JSON.stringify(prods));
alert('¡Listo! Ya salió con su botón de RESERVAR');
document.getElementById('nombre').value="";document.getElementById('precio').value="";cargar();}
function borrar(i){let prods=JSON.parse(localStorage.getItem('zedrip_productos')||'[]');prods.splice(i,1);localStorage.setItem('zedrip_productos',JSON.stringify(prods));cargar();}
cargar();
</script>
</body>
</html>
