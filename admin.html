<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Editar ZEDRIP - Solo tú</title><style>body{font-family:Arial;padding:15px;background:#f5efe6}input,select{width:100%;padding:10px;margin:5px 0;border-radius:10px;border:1px solid #ccc;box-sizing:border-box}button{padding:10px 15px;border:none;border-radius:10px;background:#000;color:#fff;margin:5px 0}.card{background:#fff;padding:12px;border-radius:12px;margin:10px 0}img{width:100%;height:150px;object-fit:cover;border-radius:10px}.res{background:#e8ffe8;padding:10px;border-radius:10px;margin:8px 0}</style></head>
<body><h2>ZEDRIP - Panel Privado Solo Tú</h2>
<div id="login"><input type="password" id="pass" placeholder="Tu clave"><button onclick="entrar()">Entrar</button><p style="font-size:12px">Clave inicial: ZEDRIP123</p></div>
<div id="panel" style="display:none">
<h3>➕ Agregar / Editar Producto</h3>
<input id="n" placeholder="Nombre ej: Polo Drip Oversize"><select id="c"><option>Polos</option><option>Hoodies</option><option>Joggers</option><option>Polo drip</option></select><input id="p" type="number" placeholder="Precio ej: 49.99"><input id="img" placeholder="Foto principal ej: polo-negro.jpg"><input id="imgNegro" placeholder="Foto Negro ej: polo-negro.jpg"><input id="imgBlanco" placeholder="Foto Blanco ej: polo-blanco.jpg"><input id="imgGris" placeholder="Foto Gris ej: polo-gris.jpg"><button onclick="agregar()">GUARDAR PRODUCTO EN MI TIENDA</button>
<div id="lista"></div>
<h3>📦 Reservas de clientes</h3><div id="reservas"></div>
<h3>🛒 Pedidos del Carrito</h3><div id="pedidos"></div>
<button onclick="location.href='index.html'">VER MI TIENDA</button>
</div>
<script>
let CLAVE=localStorage.getItem('zedrip_clave')||'ZEDRIP123';
function entrar(){if(document.getElementById('pass').value===CLAVE){document.getElementById('login').style.display='none';document.getElementById('panel').style.display='block';listar();listarReservas();listarPedidos();}else alert('Clave incorrecta, solo tú');}
function getP(){return JSON.parse(localStorage.getItem('zedrip_prods')||'[]');}
function saveP(p){localStorage.setItem('zedrip_prods',JSON.stringify(p));}
function agregar(){let n=document.getElementById('n').value,p=parseFloat(document.getElementById('p').value);if(!n||!p){alert('Pon nombre y precio');return;}let arr=getP();arr.push({n:n,c:document.getElementById('c').value,p:p,img:document.getElementById('img').value||document.getElementById('imgNegro').value||'polo-negro.jpg',negro:document.getElementById('imgNegro').value||document.getElementById('img').value,blanco:document.getElementById('imgBlanco').value||document.getElementById('img').value,gris:document.getElementById('imgGris').value||document.getElementById('img').value});saveP(arr);listar();alert('¡Listo! Ya sale en tu tienda');}
function borrar(i){let a=getP();a.splice(i,1);saveP(a);listar();}
function listar(){let a=getP();document.getElementById('lista').innerHTML='<h3>Tus productos en tienda ('+a.length+')</h3>'+(a.length==0?'Aún no hay, agrega uno':a.map((x,i)=>`<div class="card"><img src="${x.img}"><b>${x.n}</b> - ${x.c} - S/ ${x.p}<br><button onclick="borrar(${i})">Borrar</button></div>`).join(''));}
function listarReservas(){let r=JSON.parse(localStorage.getItem('zedrip_reservas')||'[]');document.getElementById('reservas').innerHTML=r.length==0?'Aún no hay reservas':r.map(x=>`<div class="res"><b>${x.prod}</b><br>Cliente: ${x.nombre} - ${x.tel}<br>Talla: ${x.talla} Color: ${x.color} Cant: ${x.cant}<br>${x.fecha}</div>`).join('');}
function listarPedidos(){let p=JSON.parse(localStorage.getItem('zedrip_pedidos')||'[]');document.getElementById('pedidos').innerHTML=p.length==0?'Aún no hay pedidos':p.map(x=>`<div class="res"><b>${x.fecha}</b><br>${x.nombre} - ${x.tel}<br>Entrega: ${x.entrega} - ${x.dir} ${x.det}<br>Pago: ${x.pago}<br>${x.items.map(i=>i.n+' '+i.color+' '+i.talla+' x'+i.q).join('<br>')}<br><b>Total: S/ ${x.total.toFixed(2)}</b></div>`).join('');}
</script></body></html>
