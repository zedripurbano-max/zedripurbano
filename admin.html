<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Admin ZEDRIP</title><style>body{font-family:Arial;padding:15px;background:#f5f5f5}input,select{width:100%;padding:10px;margin:6px 0;border:1px solid #ccc;border-radius:10px;box-sizing:border-box}button{padding:12px;border:none;border-radius:10px;font-weight:bold}.card{background:#fff;padding:12px;border-radius:12px;margin:10px 0}.card img{width:100%;height:150px;object-fit:cover;border-radius:10px}.heroMini{width:100%;height:140px;background:#000 url('hero.jpg') center/cover no-repeat;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#fff;font-family:Georgia;font-size:32px;letter-spacing:4px}</style></head><body>
<div class="heroMini">ZEDRIP</div>
<h2 style="margin:12px 0 0">ADMIN ZEDRIP</h2><a href="index.html">← Ver tienda</a> | <a href="#" onclick="sessionStorage.removeItem('zedrip_admin');location.href='index.html'">🔒 Cerrar sesión</a><hr>
<h3>Agregar producto</h3><input id="n" placeholder="Nombre ej: Polo blanco"><input id="p" type="number" placeholder="Precio ej: 25"><select id="c"><option>Polos</option><option>Hoodies</option><option>Joggers</option><option>Polo drip</option></select><p style="font-size:13px;margin:5px 0"><b>📸 SUBE LA FOTO AQUÍ - NO ESCRIBAS EL NOMBRE:</b></p><input type="file" id="fotoFile" accept="image/*" style="background:#fff"><img id="vista" style="width:100%;height:150px;object-fit:cover;border-radius:10px;display:none;margin-top:8px"><input id="img" placeholder="O escribe: polo-blanco.jpg"><input id="neg" placeholder="Foto Negro ej: polo-negro.jpg"><input id="bla" placeholder="Foto Blanco ej: polo-blanco.jpg"><input id="gri" placeholder="Foto Gris ej: polo-gris.jpg"><button style="background:#000;color:#fff;width:100%" onclick="agregar()">+ AGREGAR PRODUCTO</button>
<h3>Productos</h3><div id="lista"></div><h3>Pedidos</h3><div id="ped"></div><h3>Reservas</h3><div id="res"></div>
<script>
if(sessionStorage.getItem('zedrip_admin')!=='ok'){let c=prompt('🔒 Contraseña Admin ZEDRIP:');if(c!=='zedripmiguel0505200822'){alert('Contraseña incorrecta');window.location.href='index.html';}else{sessionStorage.setItem('zedrip_admin','ok');}}
let fotoSubida='';
document.getElementById('fotoFile').onchange=function(e){let f=e.target.files[0];if(!f) return;let r=new FileReader();r.onload=function(){fotoSubida=r.result;let v=document.getElementById('vista');v.src=fotoSubida;v.style.display='block';};r.readAsDataURL(f);};
function getP(){let d=localStorage.getItem('zedrip_prods');if(d){let p=JSON.parse(d);if(p.length>0) return p;}return [{n:'Polo Drip Oversize',c:'Polos',p:49.99,img:'polo-negro.jpg',negro:'polo-negro.jpg',blanco:'polo-blanco.jpg',gris:'polo-gris.jpg'}];}
function pintar(){let l=document.getElementById('lista');l.innerHTML='';getP().forEach((x,i)=>{let f=x.img;if(x.n.toLowerCase().includes('blanco')) f=x.blanco||x.img;if(x.n.toLowerCase().includes('gris')) f=x.gris||x.img;l.innerHTML+=`<div class="card"><img src="${f}" onerror="this.src='polo-negro.jpg'"><b>${x.n}</b> - S/ ${x.p}<br>${x.c}<br><button onclick="borrar(${i})" style="background:red;color:#fff;margin-top:8px">Borrar</button></div>`});let pe=JSON.parse(localStorage.getItem('zedrip_pedidos')||'[]');document.getElementById('ped').innerHTML=pe.length?pe.map(x=>`<div class="card">${x.fecha} - ${x.nombre} - ${x.tel} - ${x.entrega} - ${x.pago} - S/ ${x.total} - ${x.items.map(i=>i.n+' '+i.color+' '+i.talla).join(', ')}</div>`).join(''):'Sin pedidos';let r=JSON.parse(localStorage.getItem('zedrip_reservas')||'[]');document.getElementById('res').innerHTML=r.length?r.map(x=>`<div class="card">${x.fecha} - ${x.prod} - ${x.nombre} - ${x.tel} - Modelo: ${x.modelo||x.color} - Talla: ${x.talla} - Cant: ${x.cant}</div>`).join(''):'Sin reservas';}
function agregar(){let n=document.getElementById('n').value,p=parseFloat(document.getElementById('p').value);if(!n||!p){alert('Pon nombre y precio');return;}let arr=getP();let principal=fotoSubida||document.getElementById('img').value||'polo-negro.jpg';let esBlanco=n.toLowerCase().includes('blanco'),esGris=n.toLowerCase().includes('gris'),esNegro=n.toLowerCase().includes('negro');arr.push({n:n,c:document.getElementById('c').value,p:p,img:principal,negro:esNegro?principal:(document.getElementById('neg').value||'polo-negro.jpg'),blanco:esBlanco?principal:(document.getElementById('bla').value||'polo-blanco.jpg'),gris:esGris?principal:(document.getElementById('gri').value||'polo-gris.jpg')});localStorage.setItem('zedrip_prods',JSON.stringify(arr));pintar();alert('Agregado');}
function borrar(i){let a=getP();a.splice(i,1);localStorage.setItem('zedrip_prods',JSON.stringify(a));pintar();}
pintar();
</script></body></html>
