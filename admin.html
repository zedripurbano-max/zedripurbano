<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Editar Mi Tienda - ZEDRIP</title><style>body{font-family:Arial;background:#eee;padding:20px}input,select{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:1px solid #ccc;box-sizing:border-box}.guardar{background:#00c853;color:#fff;border:none;padding:15px;width:100%;border-radius:10px;font-weight:bold}.ver{background:#000;color:#fff;display:block;text-align:center;padding:15px;border-radius:10px;text-decoration:none;margin-top:10px}.card{background:#fff;padding:10px;margin-top:15px;border-radius:10px}.card img{width:100%;height:180px;object-fit:cover;border-radius:8px}</style></head>
<body><h2>Editar Mi Tienda - ZEDRIP</h2>
Nombre <input id="nombre" placeholder="Ej: Polo Negro ZEDRIP">
Precio S/ <input id="precio" type="number" value="59">
Categoría <select id="categoria"><option>Polos</option><option>Hoodies</option><option>Pantalones</option></select>
Foto (link) <input id="foto" placeholder="https://...">
<button class="guardar" onclick="guardar()">GUARDAR PRODUCTO</button>
<a class="ver" href="index.html">VER TIENDA</a>
<h2>Mis productos</h2><div id="lista"></div>
<script>
let base=[
{nombre:"Polo Oversize Blanco",precio:59,categoria:"Polos",foto:"https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=500"},
{nombre:"Hoodie Negro ZEDRIP",precio:129,categoria:"Hoodies",foto:"https://images.unsplash.com/photo-1556821840-3a63f95609a7?w=500"},
{nombre:"Pantalón Cargo Beige",precio:99,categoria:"Pantalones",foto:"https://images.unsplash.com/photo-1624378439575-d8705ad7ae80?w=500"}
];
function get(){return JSON.parse(localStorage.getItem("productos_zedrip")||"null")||base}
function mostrar(){let ps=get();document.getElementById("lista").innerHTML=ps.map((p,i)=>`<div class="card"><img src="${p.foto}"><b>${p.nombre}</b><p>S/ ${p.precio} - ${p.categoria}</p><button onclick="eliminar(${i})" style="background:red;color:#fff;border:none;padding:10px;width:100%;border-radius:8px">ELIMINAR</button></div>`).join("")}
function guardar(){let ps=get();ps.push({nombre:document.getElementById("nombre").value,precio:document.getElementById("precio").value,categoria:document.getElementById("categoria").value,foto:document.getElementById("foto").value});localStorage.setItem("productos_zedrip",JSON.stringify(ps));alert("Guardado! Ahora ve a VER TIENDA");mostrar()}
function eliminar(i){let ps=get();ps.splice(i,1);localStorage.setItem("productos_zedrip",JSON.stringify(ps));mostrar()}
mostrar();
</script></body></html>
