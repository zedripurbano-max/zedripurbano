<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin ZEDRIP</title>
<style>
*{box-sizing:border-box;font-family:Arial} body{margin:0;background:#f2f2f2;padding:12px}
h2{text-align:center} .box{background:#fff;padding:15px;border-radius:12px;margin-bottom:12px}
input,textarea{width:100%;padding:11px;margin:6px 0;border:1px solid #ddd;border-radius:9px}
.btn{background:#000;color:#fff;border:0;padding:13px;border-radius:10px;width:100%;font-weight:bold}
.prod{display:flex;gap:10px;align-items:center;border-bottom:1px solid #eee;padding:8px 0}
.prod img{width:60px;height:60px;object-fit:cover;border-radius:8px}
.prod button{padding:7px 10px;border:0;border-radius:8px}
</style>
</head>
<body>
<h2>ZEDRIP - ADMIN</h2>
<div class="box" id="loginBox">
<h3>Entrar</h3>
<input id="email" placeholder="Tu correo">
<input id="pass" type="password" placeholder="Tu contraseña">
<button class="btn" onclick="entrar()">Entrar</button>
<p style="font-size:12px;color:#888">Solo tú puedes entrar con tu correo y contraseña de Firebase.</p>
</div>

<div class="box" id="adminBox" style="display:none">
<p>Conectado: <b id="userEmail"></b> <button onclick="salir()">Salir</button></p>
<h3>Agregar / Editar Producto</h3>
<input id="nombre" placeholder="Nombre: Ej. Polo Oversize Negro">
<input id="precio" type="number" placeholder="Precio S/ Ej. 59">
<textarea id="desc" placeholder="Descripción: Ej. Talla S-M-L, algodón"></textarea>
<p>Foto:</p>
<input type="file" id="fotoInput" accept="image/*">
<img id="vistaPrevia" style="width:100%;border-radius:10px;display:none">
<input type="hidden" id="editId">
<button class="btn" onclick="guardar()">GUARDAR PRODUCTO</button>
</div>

<div class="box" id="listaBox" style="display:none">
<h3>Mis Productos</h3>
<div id="lista"></div>
</div>
<a href="index.html">← Ver mi tienda</a>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
const firebaseConfig = {
  apiKey: "PEGA_AQUI_APIKEY",
  authDomain: "PEGA_AQUI_AUTHDOMAIN",
  projectId: "PEGA_AQUI_PROJECTID",
  storageBucket: "PEGA_AQUI_STORAGE",
  messagingSenderId: "PEGA_AQUI_SENDER",
  appId: "PEGA_AQUI_APPID"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);
let fotoBase64="";
document.getElementById('fotoInput').addEventListener('change', e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=ev=>{
    const img=new Image(); img.onload=()=>{
      const c=document.createElement('canvas'); const max=800; let w=img.width,h=img.height;
      if(w>max){h=h*max/w;w=max} c.width=w;c.height=h; c.getContext('2d').drawImage(img,0,0,w,h);
      fotoBase64=c.toDataURL('image/jpeg',0.7);
      const v=document.getElementById('vistaPrevia'); v.src=fotoBase64; v.style.display='block';
    }; img.src=ev.target.result;
  }; r.readAsDataURL(f);
});
window.entrar=async()=>{ try{ await signInWithEmailAndPassword(auth,document.getElementById('email').value,document.getElementById('pass').value);}catch(e){alert("Correo o contraseña incorrecta");} };
window.salir=async()=>{ await signOut(auth); location.reload(); };
onAuthStateChanged(auth,user=>{ if(user){ document.getElementById('loginBox').style.display='none'; document.getElementById('adminBox').style.display='block'; document.getElementById('listaBox').style.display='block'; document.getElementById('userEmail').innerText=user.email; cargar(); }});
async function cargar(){
  const snap=await getDocs(collection(db,"productos")); let html="";
  snap.forEach(d=>{ const p=d.data(); html+=`<div class="prod"><img src="${p.foto}"><div style="flex:1"><b>${p.nombre}</b><br>S/ ${p.precio}</div><button onclick="editar('${d.id}')">Editar</button><button style="background:#ffcccc" onclick="borrar('${d.id}')">Borrar</button></div>`; });
  document.getElementById('lista').innerHTML=html||"Aún no hay productos";
  window._datos={}; snap.forEach(d=>{ window._datos[d.id]=d.data(); });
}
window.guardar=async()=>{
  const nombre=document.getElementById('nombre').value; const precio=document.getElementById('precio').value; const desc=document.getElementById('desc').value; const id=document.getElementById('editId').value;
  if(!nombre||!precio) return alert("Falta nombre y precio");
  if(id){ await updateDoc(doc(db,"productos",id),{nombre,precio,desc,foto: fotoBase64 || window._datos[id].foto}); }
  else{ if(!fotoBase64) return alert("Elige una foto"); await addDoc(collection(db,"productos"),{nombre,precio,desc,foto:fotoBase64}); }
  alert("Guardado en ZEDRIP!"); document.getElementById('nombre').value=""; document.getElementById('precio').value=""; document.getElementById('desc').value=""; document.getElementById('editId').value=""; fotoBase64=""; document.getElementById('vistaPrevia').style.display='none'; cargar();
};
window.borrar=async(id)=>{ if(confirm("¿Borrar este producto?")){ await deleteDoc(doc(db,"productos",id)); cargar(); } };
window.editar=(id)=>{ const p=window._datos[id]; document.getElementById('editId').value=id; document.getElementById('nombre').value=p.nombre; document.getElementById('precio').value=p.precio; document.getElementById('desc').value=p.desc||""; document.getElementById('vistaPrevia').src=p.foto; document.getElementById('vistaPrevia').style.display='block'; window.scrollTo(0,0); alert("Edita arriba y toca GUARDAR"); };
</script>
</body>
</html>
